name: NAD R23 national conveyor (non-production)

on:
  workflow_dispatch:

env:
  LAYER_URL: https://services.arcgis.com/xOi1kZaI0eWDREZv/ArcGIS/rest/services/Address_Points_from_National_Address_Database_view/FeatureServer/0

jobs:
  plan-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: plan
        env:
          LAYER_URL: ${{ env.LAYER_URL }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.parse, urllib.request
          stats = [{"statisticType": k, "onStatisticField": "OBJECTID", "outStatisticFieldName": n} for k,n in (("count","count"),("min","min"),("max","max"))]
          q = urllib.parse.urlencode({"f":"json","where":"1=1","outStatistics":json.dumps(stats),"returnGeometry":"false"})
          payload = json.loads(urllib.request.urlopen(os.environ["LAYER_URL"]+"/query?"+q, timeout=60).read())
          if payload.get("error") or not payload.get("features"):
              raise SystemExit(f"missing official NAD statistics: {payload}")
          attrs = payload["features"][0]["attributes"]
          lo, hi, count = int(attrs["min"]), int(attrs["max"]), int(attrs["count"])
          if count <= 0 or hi <= lo: raise SystemExit("non-positive official NAD statistics")
          parts = 16; width = (hi - lo + parts) // parts
          shards = [{"lower": lo + i*width - 1, "upper": min(hi, lo + (i+1)*width - 1), "index": i} for i in range(parts) if lo + i*width <= hi]
          print("shards=" + json.dumps(shards, separators=(",", ":")))
          PY

  ingest:
    needs: plan-shards
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-shards.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire keyset shard
        run: |
          mkdir -p /tmp/nad-evidence
          python -m engine.acquisition.nad_feature_server \
            --workdir /tmp/nad-evidence \
            --lower '${{ matrix.shard.lower }}' \
            --upper '${{ matrix.shard.upper }}' \
            --generation 'r23-20260630-oid-${{ matrix.shard.index }}'
      - uses: actions/upload-artifact@v4
        with:
          name: nad-r23-oid-${{ matrix.shard.index }}
          path: /tmp/nad-evidence

  reconcile:
    needs: ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nad-r23-oid-*
          path: /tmp/nad-evidence
          merge-multiple: true
      - name: Verify shard reconciliation and 51-jurisdiction coverage
        run: |
          python - <<'PY'
          import json, pathlib
          expected = set("AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split())
          manifests = list(pathlib.Path('/tmp/nad-evidence').rglob('*.manifest.json'))
          if not manifests: raise SystemExit('no shard manifests')
          seen = set(); source = canonical = rejects = duplicates = 0
          for path in manifests:
              data=json.loads(path.read_text()); c=data['counts']
              if c['source_records'] != c['canonical_records'] + c['duplicates'] + c['rejects']:
                  raise SystemExit(f'unreconciled shard: {path}')
              source += c['source_records']; canonical += c['canonical_records']; rejects += c['rejects']; duplicates += c['duplicates']; seen.update(data.get('records_by_state', {}))
          missing=sorted(expected-seen)
          if missing: raise SystemExit(f'missing jurisdictions in live canonical output: {missing}')
          print(json.dumps({'shards':len(manifests),'source_records':source,'canonical_records':canonical,'duplicates':duplicates,'rejects':rejects,'states':len(seen)}, sort_keys=True))
          PY
